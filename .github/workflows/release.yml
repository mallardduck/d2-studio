name: Release

# Pushing a tag such as v0.1.0-rc.1 builds every platform and creates a release.
#
# It is a DRAFT for a person to review and publish, with one optional
# exception: a pre-release tag (one with a suffix, like -rc.1) is published
# automatically when the repository variable AUTO_PUBLISH_PRERELEASES is
# "true" and every platform built, has all its files, and passed its smoke
# test (scripts/release-gate.sh). Stable tags are always drafts.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  release:
    name: Draft release
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft release and attach files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Windows and macOS only accept numeric versions, so the number is fixed
      # in build/config.yml and the tag may add a suffix (-rc.1) but not change it.
      - name: Check the tag matches the app version
        run: |
          core="${GITHUB_REF_NAME#v}"
          core="${core%%-*}"
          want=$(sed -n 's/^[[:space:]]*version:[[:space:]]*"\([^"]*\)".*/\1/p' build/config.yml | head -1)
          if [ "$core" != "$want" ]; then
            echo "The tag ${GITHUB_REF_NAME} is for version ${core}, but build/config.yml says ${want}." >&2
            echo "Update build/config.yml and version.go, or use a tag like v${want}-rc.1." >&2
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: d2-studio-*
          merge-multiple: true
          path: dist

      - name: Check every platform was built
        run: |
          for platform in macos windows linux; do
            test -f "dist/SHA256SUMS-${platform}.txt" || { echo "No ${platform} build was produced." >&2; exit 1; }
          done

      - name: Combine the checksums
        run: |
          cd dist
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          rm SHA256SUMS-*.txt

      # The smoke results are inputs to the decision, not release files.
      - name: Keep the smoke results out of the release
        run: |
          mkdir gates
          # A platform that recorded no result simply fails the gate (a draft).
          shopt -s nullglob
          for f in dist/SMOKE-*.txt; do mv "$f" gates/; done

      - name: Decide whether to publish or leave a draft
        id: gate
        env:
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH_PRERELEASES }}
        run: |
          scripts/release-gate.sh dist gates "${GITHUB_REF_NAME}" "${AUTO_PUBLISH}" | tee -a "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ steps.gate.outputs.publish }}
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          flags=(--verify-tag --title "D2 Studio ${GITHUB_REF_NAME}" --notes-file .github/release-notes.md)
          if [ "${PUBLISH}" = "true" ]; then
            # Only ever a pre-release, and never the "latest" release.
            flags+=(--prerelease --latest=false)
            echo "Published automatically: ${REASON}" >> "$GITHUB_STEP_SUMMARY"
          else
            flags+=(--draft)
            case "${GITHUB_REF_NAME}" in *-*) flags+=(--prerelease) ;; esac
            echo "Left as a draft for review: ${REASON}" >> "$GITHUB_STEP_SUMMARY"
          fi
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}" dist/*
